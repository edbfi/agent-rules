services:
  postgres:
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: guide
      POSTGRES_DB: guide
    ports:
      - '127.0.0.1:${GUIDE_PG_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guide -d guide']
      interval: 1s
      timeout: 3s
      retries: 30
