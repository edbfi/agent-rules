name: sync rules
on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact opted-in edbfi repository slug
        required: true
        type: string
      source-sha:
        description: Reviewed canonical default-branch SHA with successful final CI
        required: true
        type: string
      preview-run:
        description: Successful preview workflow run ID reviewed by the maintainer
        required: true
        type: string
      plan-sha256:
        description: Reviewed plan.json SHA256 from that run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: rules-delivery-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'edbfi/agent-rules' && github.ref_name == github.event.repository.default_branch && github.sha == inputs.source-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the reviewed preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview-run }}
        run: |
          [[ "$PREVIEW_RUN" =~ ^[0-9]+$ ]]
          gh run download "$PREVIEW_RUN" --repo edbfi/agent-rules --name rules-plan --dir "$RUNNER_TEMP/rules-plan"
      - name: Publish only the unchanged reviewed plan
        env:
          GH_TOKEN: ${{ secrets.RULES_SYNC_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PREVIEW_RUN: ${{ inputs.preview-run }}
          PLAN_SHA256: ${{ inputs.plan-sha256 }}
        run: |
          test -n "$GH_TOKEN"
          python3 .github/scripts/delivery.py publish --target "$TARGET" --source-sha "$SOURCE_SHA" --preview-run "$PREVIEW_RUN" --plan-sha256 "$PLAN_SHA256" --output "$RUNNER_TEMP/rules-plan"
