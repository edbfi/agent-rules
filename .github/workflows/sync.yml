name: sync rules
on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'manifest.toml'
      - '.github/workflows/sync.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-rules
  cancel-in-progress: false
jobs:
  targets:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.targets.outputs.repositories }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: targets
        run: python3 .github/scripts/check-content.py --targets >> "$GITHUB_OUTPUT"
  sync:
    needs: targets
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repository: ${{ fromJSON(needs.targets.outputs.repositories) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: canonical
          persist-credentials: false
      - name: Resolve the consumer default branch
        id: base
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: |
          test -n "$GH_TOKEN"
          base=$(gh api "repos/$TARGET_REPOSITORY" --jq .default_branch)
          test -n "$base"
          echo "branch=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ steps.base.outputs.branch }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: targets/consumer
          persist-credentials: false
      - name: Hydrate only the isolated consumer checkout
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: |
          AGENT_RULES_ROOT="$GITHUB_WORKSPACE/targets" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/no-local-manifest" \
            bash canonical/bin/sync --apply "$TARGET_REPOSITORY"
      - name: Propose a checked rules update
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          path: targets/consumer
          base: ${{ steps.base.outputs.branch }}
          branch: fix/sync-agent-rules
          add-paths: .agents/rules
          signoff: true
          commit-message: 'chore(rules): sync canonical agent guidance'
          title: 'chore(rules): sync canonical agent guidance'
          body: |
            Update the published rules from engels74/agent-rules.

            Canonical content and public manifest validation passed. The sync
            preserves the public opt-in list, prunes replaced filenames and
            verifies copied bytes. Review any toolchain-floor implications and
            merge after the consumer's required development CI passes.

            This PR uses the existing sync token, so normal pull-request
            workflows run. Missing or unsuccessful required checks block merging.
