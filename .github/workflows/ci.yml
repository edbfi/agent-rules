name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate canonical content and sync syntax
        run: |
          python3 .github/scripts/check-content.py
          python3 -m py_compile .github/scripts/*.py
          python3 -m unittest discover -s tests -v
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [content]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v4.1.1
        with:
          needs: ${{ toJSON(needs) }}
          required: content
